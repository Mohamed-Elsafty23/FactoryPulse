[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorypulse"
version = "0.1.8"
description = "Manufacturing reliability lakehouse on Azure"
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "click>=8.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "faker>=25.0",
    "psycopg2-binary>=2.9",
    "pymssql>=2.3",
    "sqlalchemy>=2.0",
    "boto3>=1.34",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff==0.17.1",  # pinned: see .pre-commit-config.yaml and ci.yml
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]
dashboard = [
    "streamlit>=1.49",
    "plotly>=5.24",
    "duckdb>=1.1",
    "pandas>=2.2",
]

[project.scripts]
factorypulse = "factorypulse.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/factorypulse"]

[tool.ruff]
# Must match requires-python's floor (3.10), not its ceiling: the Databricks
# serverless runtime executes this package on Python 3.10, so rules that
# suggest 3.11+ idioms (UP017 datetime.UTC, UP042 StrEnum) would green-light
# code that fails at runtime there.
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
# Databricks injects `spark` and `dbutils` into the notebook namespace, and
# `cfg` arrives from `%run ./_bootstrap` — none of which ruff can see. E402:
# notebooks must set env vars BEFORE importing factorypulse.config.
"notebooks/*" = ["E402", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that start a Spark session (deselect with -m 'not slow')",
]
