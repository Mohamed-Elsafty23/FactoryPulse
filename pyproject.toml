[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorypulse"
version = "0.1.0"
description = "Manufacturing reliability lakehouse on Azure"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "faker>=25.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "click>=8.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[project.scripts]
factorypulse = "factorypulse.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/factorypulse"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: tests that start a Spark session (deselect with -m 'not slow')",
]
