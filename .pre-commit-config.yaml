# Generated data and rendered media are deliberate, committed deliverables:
# exports/ is the Parquet snapshot the dashboard reads with Azure deleted, and
# docs/diagrams/ holds the rendered walkthrough. Neither is hand-edited, so the
# whitespace hooks have nothing useful to do there — and "fixing" a Spark
# _committed_* marker or a rendered SVG only creates noise.
exclude: "^(exports/|docs/diagrams/pipeline_a|docs/evidence/)"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        # The rendered WebM (~2.4 MB) and the Gold Parquet snapshot are the
        # two largest committed artifacts and both are intentional.
        args: ["--maxkb=3000"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # keep in step with pyproject + ci.yml
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "\\.secrets\\.baseline$|ai4i2020\\.csv$"
