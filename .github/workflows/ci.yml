name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests

  test:
    name: Tests (Spark + Delta)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Cache Ivy JARs
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-delta3.2-spark3.5
          restore-keys: ivy-${{ runner.os }}-
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          # The dashboard extra is required, not optional, for the test run:
          # tests/test_metrics.py and tests/test_charts.py import duckdb and
          # plotly at module level, so without it pytest fails at collection.
          pip install -e ".[dev,dashboard]"
      - name: Run tests
        run: pytest -v --tb=short

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install detect-secrets
      - name: Scan for secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
